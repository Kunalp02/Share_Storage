[project]
name = "ccil-storage-service"
version = "0.2.0"
description = "Thread artifact storage (PostgreSQL metadata + S3/MinIO)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ccil-platform-auth",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "asyncpg>=0.30.0",
  "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
storage-service = "storage_service.main:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
