[project]
name = "ccil-agent-execution-service"
version = "4.0.0"
description = "Agent runtime: threads, runs, and a LangGraph execution engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "asyncpg>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
agent-execution = "agent_execution.main:main"
agent-execution-worker = "agent_execution.worker_main:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
